```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Heart Assault</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #05060b;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
    cursor: crosshair;
}

#hud {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 5;
    pointer-events: none;
    text-shadow: 0 0 10px #000;
}

#score {
    font-size: 25px;
    font-weight: bold;
}

#healthBox {
    margin-top: 10px;
    width: 220px;
    height: 18px;
    border: 2px solid white;
    border-radius: 20px;
    overflow: hidden;
}

#health {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg,#ff1744,#ff5252);
    transition: width .2s;
}

#ammo {
    margin-top: 8px;
    font-size: 18px;
}

#love {
    color: #ff4f9a;
    margin-top: 4px;
}

#startScreen,
#gameOver {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at center,rgba(255,20,100,.18),transparent 40%),
        rgba(3,4,10,.92);
}

.panel {
    width: min(600px,90%);
    padding: 40px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 25px;
    background: rgba(20,20,35,.75);
    box-shadow:
        0 0 50px rgba(255,0,100,.15),
        inset 0 0 40px rgba(255,255,255,.03);
    backdrop-filter: blur(15px);
}

h1 {
    font-size: clamp(38px,7vw,75px);
    background: linear-gradient(90deg,#ff2d75,#9c6cff,#45caff);
    -webkit-background-clip: text;
    color: transparent;
    margin-bottom: 15px;
}

button {
    margin-top: 25px;
    padding: 14px 35px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg,#ff216d,#8f4dff);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(255,40,130,.35);
}

button:hover {
    transform: scale(1.05);
}

.hidden {
    display: none !important;
}

#crosshair {
    position: fixed;
    pointer-events: none;
    z-index: 10;
    width: 25px;
    height: 25px;
    transform: translate(-50%,-50%);
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: #fff;
    box-shadow: 0 0 8px #ff3c8c;
}

#crosshair::before {
    width: 2px;
    height: 25px;
    left: 11px;
}

#crosshair::after {
    width: 25px;
    height: 2px;
    top: 11px;
}

#hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    opacity: .65;
    font-size: 13px;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div id="score">SCORE: 0</div>

    <div id="healthBox">
        <div id="health"></div>
    </div>

    <div id="ammo">AMMO: 12 / 12</div>
    <div id="love">❤️ LOVE ENERGY: 100</div>
</div>

<div id="crosshair"></div>

<div id="hint">
    WASD / Arrow Keys • Mouse Aim • Click Shoot • R Reload • Shift Dash
</div>

<div id="startScreen">
    <div class="panel">
        <h1>NEON HEART</h1>
        <p>A fast-paced physics-based neon shooter.</p>
        <p style="margin-top:10px;opacity:.7">
            Survive the enemy waves and collect ❤️ Love Energy.
        </p>
        <button onclick="startGame()">START GAME</button>
    </div>
</div>

<div id="gameOver" class="hidden">
    <div class="panel">
        <h1>GAME OVER</h1>
        <p id="finalScore">Score: 0</p>
        <button onclick="startGame()">PLAY AGAIN</button>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

const keys = {};
const mouse = {
    x: W/2,
    y: H/2,
    down: false
};

addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if(e.key.toLowerCase() === "r") reload();

    if(e.key === "Shift") dash();
});

addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;

    const cross = document.getElementById("crosshair");
    cross.style.left = e.clientX + "px";
    cross.style.top = e.clientY + "px";
});

addEventListener("mousedown", () => mouse.down = true);
addEventListener("mouseup", () => mouse.down = false);

let gameRunning = false;
let score = 0;
let wave = 1;
let spawnTimer = 0;
let shake = 0;

const player = {
    x: 0,
    y: 0,
    r: 20,
    speed: 4.5,
    health: 100,
    maxHealth: 100,
    ammo: 12,
    maxAmmo: 12,
    reloading: false,
    lastShot: 0,
    love: 100,
    dashCooldown: 0
};

let bullets = [];
let enemies = [];
let particles = [];
let pickups = [];
let stars = [];

/* ---------- STAR BACKGROUND ---------- */

for(let i=0;i<180;i++){
    stars.push({
        x: Math.random(),
        y: Math.random(),
        z: Math.random(),
        size: Math.random()*2+0.5
    });
}

/* ---------- START GAME ---------- */

function startGame(){

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("gameOver").classList.add("hidden");

    score = 0;
    wave = 1;

    player.x = W/2;
    player.y = H/2;
    player.health = 100;
    player.ammo = 12;
    player.love = 100;

    bullets = [];
    enemies = [];
    particles = [];
    pickups = [];

    gameRunning = true;

    updateHUD();
}

/* ---------- INPUT ---------- */

function movePlayer(){

    let dx = 0;
    let dy = 0;

    if(keys["w"] || keys["arrowup"]) dy--;
    if(keys["s"] || keys["arrowdown"]) dy++;
    if(keys["a"] || keys["arrowleft"]) dx--;
    if(keys["d"] || keys["arrowright"]) dx++;

    if(dx || dy){
        const len = Math.hypot(dx,dy);
        dx /= len;
        dy /= len;

        player.x += dx * player.speed;
        player.y += dy * player.speed;
    }

    player.x = Math.max(25,Math.min(W-25,player.x));
    player.y = Math.max(25,Math.min(H-25,player.y));

    if(player.dashCooldown > 0)
        player.dashCooldown--;
}

function dash(){

    if(!gameRunning || player.dashCooldown > 0 || player.love < 20)
        return;

    let dx = 0;
    let dy = 0;

    if(keys["w"]) dy--;
    if(keys["s"]) dy++;
    if(keys["a"]) dx--;
    if(keys["d"]) dx++;

    if(!dx && !dy) return;

    const len = Math.hypot(dx,dy);

    dx /= len;
    dy /= len;

    player.x += dx * 120;
    player.y += dy * 120;

    player.x = Math.max(25,Math.min(W-25,player.x));
    player.y = Math.max(25,Math.min(H-25,player.y));

    player.love -= 20;
    player.dashCooldown = 50;

    for(let i=0;i<25;i++){
        particles.push({
            x: player.x,
            y: player.y,
            vx: (Math.random()-.5)*7,
            vy: (Math.random()-.5)*7,
            life: 30,
            max: 30,
            size: Math.random()*5+2,
            type: "love"
        });
    }
}

/* ---------- SHOOTING ---------- */

function shoot(){

    if(!gameRunning || player.reloading) return;

    const now = performance.now();

    if(now - player.lastShot < 140) return;

    if(player.ammo <= 0){
        reload();
        return;
    }

    player.lastShot = now;
    player.ammo--;

    const angle = Math.atan2(
        mouse.y-player.y,
        mouse.x-player.x
    );

    const spread = (Math.random()-.5)*0.06;

    const a = angle + spread;

    bullets.push({
        x: player.x + Math.cos(a)*25,
        y: player.y + Math.sin(a)*25,
        vx: Math.cos(a)*13,
        vy: Math.sin(a)*13,
        life: 70,
        damage: 35
    });

    shake = 5;

    for(let i=0;i<8;i++){
        particles.push({
            x: player.x + Math.cos(a)*25,
            y: player.y + Math.sin(a)*25,
            vx: Math.cos(a)*Math.random()*5,
            vy: Math.sin(a)*Math.random()*5,
            life: 20,
            max: 20,
            size: Math.random()*4+2,
            type: "muzzle"
        });
    }

    updateHUD();
}

function reload(){

    if(player.reloading || player.ammo === player.maxAmmo)
        return;

    player.reloading = true;

    setTimeout(() => {
        player.ammo = player.maxAmmo;
        player.reloading = false;
        updateHUD();
    },900);
}

/* ---------- ENEMIES ---------- */

function spawnEnemy(){

    let side = Math.floor(Math.random()*4);

    let x,y;

    if(side===0){
        x = Math.random()*W;
        y = -40;
    }

    if(side===1){
        x = W+40;
        y = Math.random()*H;
    }

    if(side===2){
        x = Math.random()*W;
        y = H+40;
    }

    if(side===3){
        x = -40;
        y = Math.random()*H;
    }

    const types = [
        "chaser",
        "chaser",
        "tank",
        "shooter"
    ];

    const type = types[Math.floor(Math.random()*types.length)];

    enemies.push({
        x,
        y,
        r: type==="tank" ? 28 : 20,
        type,
        health: type==="tank" ? 130 : 60,
        maxHealth: type==="tank" ? 130 : 60,
        speed:
            type==="tank" ? 0.8 :
            type==="shooter" ? 1.1 :
            1.8,
        shootTimer: 100 + Math.random()*100
    });
}

/* ---------- BULLET PHYSICS ---------- */

function updateBullets(){

    bullets.forEach(b => {

        b.x += b.vx;
        b.y += b.vy;

        b.vx *= .995;
        b.vy *= .995;

        b.life--;

        if(b.x<0 || b.x>W || b.y<0 || b.y>H)
            b.life = 0;
    });

    bullets = bullets.filter(b => b.life>0);
}

/* ---------- ENEMY PHYSICS ---------- */

function updateEnemies(){

    enemies.forEach(e => {

        const dx = player.x-e.x;
        const dy = player.y-e.y;

        const dist = Math.hypot(dx,dy);

        if(e.type === "shooter"){

            if(dist > 260){
                e.x += dx/dist*e.speed;
                e.y += dy/dist*e.speed;
            }

            e.shootTimer--;

            if(e.shootTimer <= 0){

                e.shootTimer = 100;

                const a = Math.atan2(
                    player.y-e.y,
                    player.x-e.x
                );

                bullets.push({
                    x:e.x,
                    y:e.y,
                    vx:Math.cos(a)*5,
                    vy:Math.sin(a)*5,
                    life:150,
                    damage:12,
                    enemyBullet:true
                });
            }

        } else {

            e.x += dx/dist*e.speed;
            e.y += dy/dist*e.speed;
        }

        /* Enemy collision */

        if(dist < e.r + player.r){

            player.health -= e.type==="tank" ? .7 : .35;

            e.x -= dx/dist*3;
            e.y -= dy/dist*3;

            shake = 3;
        }
    });

    enemies = enemies.filter(e => e.health > 0);
}

/* ---------- COLLISIONS ---------- */

function collisions(){

    bullets.forEach(b => {

        if(b.enemyBullet) return;

        enemies.forEach(e => {

            const d = Math.hypot(b.x-e.x,b.y-e.y);

            if(d < e.r){

                e.health -= b.damage;
                b.life = 0;

                for(let i=0;i<12;i++){

                    particles.push({
                        x:e.x,
                        y:e.y,
                        vx:(Math.random()-.5)*6,
                        vy:(Math.random()-.5)*6,
                        life:35,
                        max:35,
                        size:Math.random()*5+2,
                        type:"hit"
                    });
                }

                if(e.health <= 0){

                    score += e.type==="tank" ? 30 : 10;

                    if(Math.random()<.15){
                        pickups.push({
                            x:e.x,
                            y:e.y,
                            r:12,
                            type:"love"
                        });
                    }

                    shake = 8;

                    for(let i=0;i<30;i++){

                        particles.push({
                            x:e.x,
                            y:e.y,
                            vx:(Math.random()-.5)*10,
                            vy:(Math.random()-.5)*10,
                            life:50,
                            max:50,
                            size:Math.random()*7+2,
                            type:"explosion"
                        });
                    }
                }
            }
        });
    });

    /* Enemy bullets */

    bullets.forEach(b => {

        if(!b.enemyBullet) return;

        const d = Math.hypot(
            b.x-player.x,
            b.y-player.y
        );

        if(d < player.r){

            b.life=0;
            player.health-=b.damage;
            shake=5;
        }
    });

    /* Pickups */

    pickups.forEach(p => {

        const d = Math.hypot(
            p.x-player.x,
            p.y-player.y
        );

        if(d < p.r+player.r){

            p.dead=true;
            player.love=Math.min(100,player.love+30);

            for(let i=0;i<20;i++){

                particles.push({
                    x:p.x,
                    y:p.y,
                    vx:(Math.random()-.5)*5,
                    vy:(Math.random()-.5)*5,
                    life:40,
                    max:40,
                    size:Math.random()*5+2,
                    type:"love"
                });
            }
        }
    });

    pickups = pickups.filter(p=>!p.dead);
}

/* ---------- PARTICLES ---------- */

function updateParticles(){

    particles.forEach(p => {

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= .97;
        p.vy *= .97;

        p.life--;
    });

    particles = particles.filter(p=>p.life>0);
}

/* ---------- DRAW BACKGROUND ---------- */

function drawBackground(){

    ctx.fillStyle="#05060b";
    ctx.fillRect(0,0,W,H);

    const gradient = ctx.createRadialGradient(
        W/2,H/2,50,
        W/2,H/2,Math.max(W,H)
    );

    gradient.addColorStop(0,"rgba(80,20,100,.15)");
    gradient.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);

    stars.forEach(s=>{

        const x=s.x*W;
        const y=s.y*H;

        ctx.globalAlpha=.2+s.z*.7;

        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(x,y,s.size*s.z,0,Math.PI*2);
        ctx.fill();
    });

    ctx.globalAlpha=1;

    /* Grid */

    ctx.strokeStyle="rgba(120,80,180,.08)";
    ctx.lineWidth=1;

    const grid=70;

    for(let x=0;x<W;x+=grid){
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(let y=0;y<H;y+=grid){
        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }
}

/* ---------- DRAW PLAYER ---------- */

function drawPlayer(){

    const angle = Math.atan2(
        mouse.y-player.y,
        mouse.x-player.x
    );

    ctx.save();

    ctx.translate(player.x,player.y);
    ctx.rotate(angle);

    /* glow */

    ctx.shadowBlur=30;
    ctx.shadowColor="#ff2d88";

    ctx.fillStyle="#ff2d88";

    ctx.beginPath();
    ctx.arc(0,0,player.r,0,Math.PI*2);
    ctx.fill();

    /* gun */

    ctx.fillStyle="#d9d9e8";

    ctx.fillRect(5,-5,35,10);

    ctx.fillStyle="#fff";

    ctx.fillRect(15,-3,30,6);

    ctx.restore();

    /* Heart */

    ctx.save();

    ctx.translate(player.x,player.y);

    ctx.fillStyle="#fff";

    ctx.font="18px Arial";
    ctx.textAlign="center";
    ctx.fillText("♥",0,7);

    ctx.restore();
}

/* ---------- DRAW ENEMIES ---------- */

function drawEnemies(){

    enemies.forEach(e=>{

        ctx.save();

        ctx.translate(e.x,e.y);

        ctx.shadowBlur=20;
        ctx.shadowColor=
            e.type==="tank" ? "#ff9d00" :
            e.type==="shooter" ? "#5d8cff" :
            "#ff1744";

        ctx.fillStyle=
            e.type==="tank" ? "#ff8c00" :
            e.type==="shooter" ? "#4976ff" :
            "#e51c46";

        ctx.beginPath();

        if(e.type==="tank"){
            ctx.rect(-e.r,-e.r,e.r*2,e.r*2);
        } else {
            ctx.arc(0,0,e.r,0,Math.PI*2);
        }

        ctx.fill();

        ctx.shadowBlur=0;

        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(-6,-4,3,0,Math.PI*2);
        ctx.arc(6,-4,3,0,Math.PI*2);
        ctx.fill();

        ctx.restore();

        /* health bar */

        ctx.fillStyle="rgba(0,0,0,.5)";
        ctx.fillRect(
            e.x-e.r,
            e.y-e.r-10,
            e.r*2,
            4
        );

        ctx.fillStyle="#ff315c";
        ctx.fillRect(
            e.x-e.r,
            e.y-e.r-10,
            e.r*2*(e.health/e.maxHealth),
            4
        );
    });
}

/* ---------- DRAW BULLETS ---------- */

function drawBullets(){

    bullets.forEach(b=>{

        ctx.save();

        ctx.shadowBlur=15;

        ctx.shadowColor=b.enemyBullet
            ? "#ff3333"
            : "#ffff9c";

        ctx.fillStyle=b.enemyBullet
            ? "#ff4545"
            : "#fff";

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.enemyBullet ? 5 : 4,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    });
}

/* ---------- DRAW PICKUPS ---------- */

function drawPickups(){

    pickups.forEach(p=>{

        ctx.save();

        ctx.translate(p.x,p.y);

        ctx.shadowBlur=25;
        ctx.shadowColor="#ff3f9b";

        ctx.fillStyle="#ff4f9b";

        ctx.font="25px Arial";
        ctx.textAlign="center";
        ctx.fillText("♥",0,8);

        ctx.restore();
    });
}

/* ---------- DRAW PARTICLES ---------- */

function drawParticles(){

    particles.forEach(p=>{

        const alpha=p.life/p.max;

        ctx.globalAlpha=alpha;

        ctx.fillStyle=
            p.type==="love" ? "#ff5fa7" :
            p.type==="hit" ? "#ffce54" :
            p.type==="muzzle" ? "#fff" :
            "#ff405d";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    });

    ctx.globalAlpha=1;
}

/* ---------- HUD ---------- */

function updateHUD(){

    document.getElementById("score").textContent =
        "SCORE: " + score;

    document.getElementById("ammo").textContent =
        player.reloading
            ? "RELOADING..."
            : `AMMO: ${player.ammo} / ${player.maxAmmo}`;

    document.getElementById("love").textContent =
        `❤️ LOVE ENERGY: ${Math.round(player.love)}`;

    document.getElementById("health").style.width =
        Math.max(0,player.health)+"%";
}

/* ---------- GAME LOOP ---------- */

function update(){

    if(!gameRunning) return;

    movePlayer();

    if(mouse.down)
        shoot();

    updateBullets();
    updateEnemies();
    collisions();
    updateParticles();

    spawnTimer--;

    if(spawnTimer <= 0){

        spawnEnemy();

        spawnTimer =
            Math.max(
                18,
                70-wave*4
            );
    }

    if(score > wave*150)
        wave++;

    player.love=Math.min(
        100,
        player.love+.015
    );

    if(player.health<=0)
        endGame();

    updateHUD();
}

function draw(){

    ctx.save();

    if(shake>0){

        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );

        shake*=.88;

        if(shake<.2)
            shake=0;
    }

    drawBackground();
    drawPickups();
    drawBullets();
    drawEnemies();
    drawPlayer();
    drawParticles();

    ctx.restore();
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

function endGame(){

    gameRunning=false;

    document.getElementById("finalScore").textContent =
        `Score: ${score} • Wave: ${wave}`;

    document.getElementById("gameOver")
        .classList.remove("hidden");
}

loop();
</script>

</body>
</html>
